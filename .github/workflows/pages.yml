name: Deploy Pages (legacy — manual only)

# Superseded by cloudflare-pages.yml as the primary deploy for programs.castalia.institute.
# Kept as a manual fallback (workflow_dispatch) during the Cloudflare Pages cutover; the
# push trigger is removed so the two deploys do not compete. Remove once Cloudflare is verified.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: programs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        working-directory: web
        env:
          # Optional repo/org Variables — embed Moodle course ids so catalog “LMS” links resolve on GitHub Pages.
          # Set in GitHub → Settings → Secrets and variables → Actions → Variables (e.g. 9 / 10 on lms.castalia.institute).
          PUBLIC_CASTALIA_MOODLE_COURSE_ID_AIMA_SIMPLE: ${{ vars.CASTALIA_MOODLE_COURSE_ID_AIMA_SIMPLE }}
          PUBLIC_CASTALIA_MOODLE_COURSE_ID_AIMA_ADVANCED: ${{ vars.CASTALIA_MOODLE_COURSE_ID_AIMA_ADVANCED }}
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
