name: Deploy Cloudflare Pages

# Primary deploy for programs.castalia.institute. Builds the Astro site and deploys it together
# with the repo-root functions/ directory (purchase-fulfillment API) to Cloudflare Pages.
# Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: programs-cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        working-directory: web
        env:
          PUBLIC_CASTALIA_MOODLE_COURSE_ID_AIMA_SIMPLE: ${{ vars.CASTALIA_MOODLE_COURSE_ID_AIMA_SIMPLE }}
          PUBLIC_CASTALIA_MOODLE_COURSE_ID_AIMA_ADVANCED: ${{ vars.CASTALIA_MOODLE_COURSE_ID_AIMA_ADVANCED }}
        run: npm ci && npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploys web/dist static output plus the repo-root functions/ directory.
          command: pages deploy web/dist --project-name=programs-castalia
